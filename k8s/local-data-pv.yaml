apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-data
  labels:
    type: local
  namespace: gdsc
spec:
  storageClassName: local-data
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{data_mount}}"

    # replace {{data_mount}} with the absolute path on your local machine to where you want to store your data
    # on windows prefix the path with: /run/desktop/mnt/host/<drive>/