apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-nominatim-flatnode
  labels:
    type: local
  namespace: gdsc
spec:
  storageClassName: local-nominatim-flatnode
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{repo}}/volumes/nominatim/flatnode"

    # replace {{repo}} with the absolute path on your local machine to where you want to store your nominatim data