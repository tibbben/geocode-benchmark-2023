apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-postgis-geocode
  labels:
    type: local
  namespace: gdsc
spec:
  storageClassName: local-postgis-geocode
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{postgis_data_dir}}"

    # replace {{postgis_data_dir}} with te absolute path on your local machine to a directory for the postgres data directory
    # on windows prefix the path with: /run/desktop/mnt/host/<drive>/